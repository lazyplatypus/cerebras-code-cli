name: publish
run-name: "publish ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.68)"
        required: true
        type: string

concurrency: publish-${{ inputs.version }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - name: Build
        working-directory: packages/opencode
        run: bun run ./script/build.ts --single
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Smoke test
        working-directory: packages/opencode
        run: |
          BINARY=$(ls dist/*/bin/cerebras 2>/dev/null || ls dist/*/bin/opencode 2>/dev/null)
          chmod +x "$BINARY"
          "$BINARY" --version

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: packages/opencode/dist/

  publish-binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Prepare package
        run: |
          OS=$(echo "${{ matrix.target }}" | cut -d- -f1)
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f2)
          DIR=$(ls -d dist/*-${{ matrix.target }} 2>/dev/null | head -1)
          cat > "$DIR/package.json" << EOF
          {
            "name": "cerebras-cli-${{ matrix.target }}",
            "version": "${{ inputs.version }}",
            "os": ["$OS"],
            "cpu": ["$ARCH"]
          }
          EOF
          chmod -R 755 "$DIR"

      - name: Publish
        run: |
          DIR=$(ls -d dist/*-${{ matrix.target }} 2>/dev/null | head -1)
          cd "$DIR" && npm publish --access public

  publish-wrapper:
    needs: publish-binaries
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Create wrapper package
        run: |
          mkdir -p pkg/bin
          cp packages/opencode/bin/opencode pkg/bin/opencode
          cp packages/opencode/bin/opencode.cjs pkg/bin/opencode.cjs
          cp packages/opencode/script/postinstall.mjs pkg/postinstall.mjs
          sed -i 's|"opencode-|"cerebras-cli-|g' pkg/bin/opencode
          sed -i 's|opencode-|cerebras-cli-|g' pkg/postinstall.mjs
          cat > pkg/package.json << EOF
          {
            "name": "cerebras-cli",
            "version": "${{ inputs.version }}",
            "description": "Cerebras AI coding agent for the terminal",
            "bin": {
              "cerebras-cli": "./bin/opencode"
            },
            "scripts": {
              "postinstall": "bun ./postinstall.mjs || node ./postinstall.mjs"
            },
            "optionalDependencies": {
              "cerebras-cli-darwin-arm64": "${{ inputs.version }}",
              "cerebras-cli-darwin-x64": "${{ inputs.version }}",
              "cerebras-cli-linux-arm64": "${{ inputs.version }}",
              "cerebras-cli-linux-x64": "${{ inputs.version }}"
            },
            "license": "MIT"
          }
          EOF

      - name: Publish
        run: cd pkg && npm publish --access public
